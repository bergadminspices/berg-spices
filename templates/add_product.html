{% extends "admin_dashboard.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Add New Product</h4>
        </div>

        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <!-- Packet Pricing -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Packet Pricing</label>

                    <div id="price-options">
                        <div class="row mb-2 price-row align-items-center">
                            <div class="col-md-5">
                                <input type="text"
                                       name="packet_label[]"
                                       class="form-control"
                                       placeholder="e.g. 50g"
                                       required>
                            </div>

                            <div class="col-md-5">
                                <input type="number"
                                       step="0.01"
                                       name="packet_price[]"
                                       class="form-control"
                                       placeholder="Price"
                                       required>
                            </div>

                            <div class="col-md-2 text-end">
                                <button type="button"
                                        class="btn btn-danger remove-row">
                                    X
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button"
                            class="btn btn-outline-secondary mt-2"
                            id="add-price-row">
                        + Add Packet Option
                    </button>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="3"></textarea>
                </div>

                <!-- Image URL -->
                <div class="mb-3">
                    <label class="form-label">Image URL (Cloudinary)</label>
                    <input type="text"
                           name="image_url"
                           class="form-control">
                </div>

                <!-- Upload Image -->
                <div class="mb-3">
                    <label class="form-label">Upload Image</label>
                    <input type="file"
                           name="image"
                           accept="image/*"
                           class="form-control">
                </div>

                <!-- Stock -->
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number"
                           name="stock"
                           class="form-control">
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text"
                           name="category"
                           class="form-control">
                </div>

                <!-- Submit -->
                <div class="text-end">
                    <button type="submit"
                            class="btn btn-success px-4">
                        Save Product
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>


<!-- Packet Dynamic Script -->
<script>
document.getElementById("add-price-row").addEventListener("click", function () {
    let container = document.getElementById("price-options");
    let firstRow = document.querySelector(".price-row");
    let newRow = firstRow.cloneNode(true);

    newRow.querySelectorAll("input").forEach(input => input.value = "");

    container.appendChild(newRow);
});

document.addEventListener("click", function (e) {
    if (e.target.classList.contains("remove-row")) {
        if (document.querySelectorAll(".price-row").length > 1) {
            e.target.closest(".price-row").remove();
        }
    }
});
</script>

{% endblock %}
