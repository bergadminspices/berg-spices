{% extends "admin_dashboard.html" %}
{% block content %}

<div class="container mt-4">
  <h3>Edit Product</h3>

  <form method="POST">

    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" name="name" class="form-control"
             value="{{ product.name }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input type="text" name="image_url" class="form-control"
             value="{{ product.image_url }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input type="number" name="stock" class="form-control"
             value="{{ product.stock }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <input type="text" name="category" class="form-control"
             value="{{ product.category }}" required>
    </div>

    <hr>

    <h5>Packet Options</h5>

    <div id="packet-container">
      {% if product.price_options %}
        {% for option in product.price_options %}
        <div class="row mb-2 packet-row">
          <div class="col">
            <input type="text" name="packet_label[]"
                   value="{{ option.label }}"
                   class="form-control"
                   placeholder="Packet Label (e.g. 250g)" required>
          </div>
          <div class="col">
            <input type="number" step="0.01" name="packet_price[]"
                   value="{{ option.price }}"
                   class="form-control"
                   placeholder="Price" required>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-danger"
                    onclick="removePacket(this)">X</button>
          </div>
        </div>
        {% endfor %}
      {% else %}
        <div class="row mb-2 packet-row">
          <div class="col">
            <input type="text" name="packet_label[]"
                   class="form-control"
                   placeholder="Packet Label (e.g. 250g)" required>
          </div>
          <div class="col">
            <input type="number" step="0.01" name="packet_price[]"
                   class="form-control"
                   placeholder="Price" required>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-danger"
                    onclick="removePacket(this)">X</button>
          </div>
        </div>
      {% endif %}
    </div>

    <button type="button" class="btn btn-secondary mt-2"
            onclick="addPacket()">+ Add Packet Option</button>

    <hr>

    <button type="submit" class="btn btn-primary">Update Product</button>
    <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>

  </form>
</div>

<script>
function addPacket() {
  const container = document.getElementById("packet-container");

  const row = document.createElement("div");
  row.className = "row mb-2 packet-row";

  row.innerHTML = `
    <div class="col">
      <input type="text" name="packet_label[]"
             class="form-control"
             placeholder="Packet Label (e.g. 250g)" required>
    </div>
    <div class="col">
      <input type="number" step="0.01" name="packet_price[]"
             class="form-control"
             placeholder="Price" required>
    </div>
    <div class="col-auto">
      <button type="button" class="btn btn-danger"
              onclick="removePacket(this)">X</button>
    </div>
  `;

  container.appendChild(row);
}

function removePacket(button) {
  button.closest(".packet-row").remove();
}
</script>

{% endblock %}
